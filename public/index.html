<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overhead</title>
<meta name="description" content="The aircraft overhead, wherever you are, as a print.">
<meta name="theme-color" content="#f4f0e4" id="themeColorMeta">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<div id="app">

  <main id="plateView">

    <figure class="print" id="print">
      <div class="print-inner">
        <div class="print-img" id="printImg">
          <div class="ph" id="ph"></div>
        </div>
        <figcaption class="print-cap">
          <p class="genus" id="pGenus">Overhead</p>
          <p class="species" id="pSpecies">waiting for the sky</p>
          <p class="particulars" id="pParticulars">&nbsp;</p>
          <p class="credit" id="pCredit">&nbsp;</p>
        </figcaption>
      </div>
      <p class="plate-no" id="plateNo">&nbsp;</p>
    </figure>

    <aside class="strip" id="strip" aria-label="Aircraft in reach"></aside>

  </main>

  <main id="clusterView" class="cluster" hidden>
    <div class="cluster-head">
      <p class="cluster-title" id="cTitle">Overhead</p>
      <p class="cluster-sub" id="cSub">&nbsp;</p>
    </div>
    <div class="cluster-grid" id="clusterGrid"></div>
  </main>

  <div id="errban" class="errban" hidden></div>

  <dialog id="cfg" class="cfg">
    <form method="dialog" id="cfgForm">
      <h2>Setup</h2>

      <div class="seg" role="radiogroup" aria-label="Location mode">
        <button type="button" id="modeAuto" class="seg-btn">Follow this device</button>
        <button type="button" id="modeManual" class="seg-btn">Fixed spot</button>
      </div>

      <div class="row2">
        <label>Latitude <input id="cLat" type="number" step="0.0001" min="-85" max="85" required autocomplete="off"></label>
        <label>Longitude <input id="cLon" type="number" step="0.0001" min="-180" max="180" required autocomplete="off"></label>
      </div>
      <div class="row2">
        <label>Place label <input id="cLabel" type="text" maxlength="24" placeholder="auto from GPS" autocomplete="off"></label>
        <button type="button" id="cGps" class="btn">Locate now</button>
      </div>
      <div class="row2">
        <label>Range
          <select id="cRadius">
            <option value="15">15 nm</option><option value="25">25 nm</option>
            <option value="40" selected>40 nm</option><option value="60">60 nm</option>
            <option value="100">100 nm</option>
          </select>
        </label>
        <label>Rotate plate
          <select id="cRotate">
            <option value="0">off</option>
            <option value="20">every 20 s</option>
            <option value="45" selected>every 45 s</option>
            <option value="90">every 90 s</option>
            <option value="300">every 5 min</option>
          </select>
        </label>
      </div>
      <label class="chk"><input id="cHideGnd" type="checkbox" checked> Hide aircraft on the ground</label>
      <div class="actions">
        <button type="button" id="cShare" class="btn">Copy link to this setup</button>
        <button class="btn primary" value="save">Done</button>
      </div>
      <p class="note" id="cNote"></p>
    </form>
  </dialog>

  <button id="btnView" class="fab view" aria-label="Switch view" title="Plate / cluster">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="13.5" y="3.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="3.5" y="13.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="13.5" y="13.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
  </button>
  <button id="btnCfg" class="fab" aria-label="Setup">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
  </button>
  <button id="btnNext" class="fab next" aria-label="Next aircraft" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M12.5 6.5 18 12l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

</div>
<script src="app.js?v=7" defer></script>
</body>
</html>
