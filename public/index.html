<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plane Overhead</title>
<meta name="description" content="Live radar of flights overhead, for a wall tablet.">
<meta name="theme-color" content="#0b100e" id="themeColorMeta">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div id="app" data-theme="scope">

  <header class="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".55"/>
        <circle cx="12" cy="12" r="5.5" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".35"/>
        <path d="M12 5.5 L13.9 17 L12 15.6 L10.1 17 Z" fill="currentColor"/>
      </svg>
      <div class="brand-text">
        <h1>Plane Overhead</h1>
        <p id="locLabel" class="sub">connecting&hellip;</p>
      </div>
    </div>
    <div class="top-right">
      <div class="clockstack">
        <span id="clock" class="clock">--:--</span>
        <span id="dateLine" class="dateline">&nbsp;</span>
      </div>
      <button id="btnTheme" class="iconbtn" aria-label="Switch theme" title="Theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4V2M12 22v-2M4 12H2m20 0h-2M6 6L4.5 4.5M18 18l1.5 1.5M6 18l-1.5 1.5M18 6l1.5-1.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button id="btnFull" class="iconbtn" aria-label="Fullscreen" title="Fullscreen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5m11-5v5h-5" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btnCfg" class="iconbtn" aria-label="Display setup" title="Setup">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.94 19.3a1.7 1.7 0 0 0-1.87.35l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.58 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 8.94a1.7 1.7 0 0 0-.35-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.58a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09c0 .68.4 1.3 1.03 1.56a1.7 1.7 0 0 0 1.87-.35l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.42 9c.26.63.88 1.03 1.56 1.03H21a2 2 0 1 1 0 4h-.09c-.68 0-1.3.4-1.51 1Z" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main class="panes">
    <section class="scope-pane">
      <svg id="scope" viewBox="-112 -112 224 224" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Radar scope of flights overhead"></svg>
      <p class="scope-legend" id="scopeLegend">callsign &middot; altitude &times;100 ft</p>
      <div class="scanline" id="scanline"></div>
    </section>

    <section class="list-pane">
      <div id="hero" class="hero">
        <p class="hero-kicker">Nearest overhead</p>
        <div class="hero-body">
          <div class="hero-cs" id="heroCs">—</div>
          <div class="hero-dist" id="heroDist">—</div>
          <p class="hero-sub" id="heroSub">waiting for first contact</p>
        </div>
      </div>

      <p class="status" id="status"><span class="chip dim">connecting</span></p>

      <div class="list-head" id="listHead"></div>
      <ol class="list" id="list"></ol>
    </section>
  </main>

  <div id="errban" class="errban" hidden></div>

  <dialog id="cfg" class="cfg">
    <form method="dialog" id="cfgForm">
      <h2>Display setup</h2>
      <div class="row2">
        <label>Latitude <input id="cLat" type="number" step="0.0001" min="-85" max="85" required autocomplete="off"></label>
        <label>Longitude <input id="cLon" type="number" step="0.0001" min="-180" max="180" required autocomplete="off"></label>
      </div>
      <div class="row2">
        <label>Place label <input id="cLabel" type="text" maxlength="24" placeholder="e.g. Home" autocomplete="off"></label>
        <button type="button" id="cGps" class="btn">Use this device's GPS</button>
      </div>
      <div class="row2">
        <label>Range
          <select id="cRadius">
            <option value="25">25 nm</option><option value="50">50 nm</option>
            <option value="60" selected>60 nm</option><option value="80">80 nm</option>
            <option value="100">100 nm</option><option value="150">150 nm</option>
            <option value="250">250 nm</option>
          </select>
        </label>
        <label>Refresh
          <select id="cInterval">
            <option value="10">every 10 s</option><option value="15" selected>every 15 s</option>
            <option value="30">every 30 s</option><option value="60">every 60 s</option>
          </select>
        </label>
      </div>
      <div class="row2">
        <label>Units
          <select id="cUnits">
            <option value="av" selected>Aviation &mdash; ft &middot; kt &middot; nm</option>
            <option value="met">Metric &mdash; m &middot; km/h &middot; km</option>
          </select>
        </label>
        <label>Theme
          <select id="cTheme">
            <option value="scope" selected>Scope (dark)</option>
            <option value="paper">Paper (light)</option>
          </select>
        </label>
      </div>
      <label class="chk"><input id="cHideGnd" type="checkbox" checked> Hide aircraft on the ground</label>
      <div class="actions">
        <button type="button" id="cShare" class="btn">Copy link to this setup</button>
        <button class="btn primary" value="save">Done</button>
      </div>
      <p class="note" id="cNote"></p>
    </form>
  </dialog>

</div>
<script src="app.js?v=1" defer></script>
</body>
</html>
