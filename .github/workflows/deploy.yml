name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate on deploy secret
        id: gate
        run: |
          if [ -z "${{ secrets.CF_PAGES_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CF_PAGES_TOKEN secret not set - skipping CI deploy (direct wrangler deploy still works)."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_PAGES_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy public --project-name plane-overhead --branch main --commit-dirty=true
